<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carte Leaflet avec données CSV et GeoJSON</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <style>
        html, body { 
            height: 100%; 
            margin: 0; 
            padding: 0; 
            font-family: Arial, sans-serif; 
        }
        #map { 
            height: 70%; 
        }
        #csv-container { 
            height: 30%; 
            overflow: auto; 
            padding: 10px; 
            background: #f5f5f5; 
            border-top: 2px solid #ccc; 
        }
        #csv-table { 
            width: 100%; 
            border-collapse: collapse; 
            font-size: 12px; 
        }
        #csv-table th, #csv-table td { 
            border: 1px solid #ddd; 
            padding: 5px; 
            text-align: left; 
        }
        #csv-table th { 
            background: #4CAF50; 
            color: white; 
            position: sticky;
            top: 0;
        }
        .popup-photo { 
            max-width: 200px; 
            height: auto; 
        }
        .highlight { 
            background-color: #ffff99 !important; 
            font-weight: bold;
        }
        .layer-control {
            background: white;
            padding: 10px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }
        .layer-control h4 {
            margin: 0 0 10px 0;
        }
        .layer-control label {
            display: block;
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div id="csv-container">
        <h3>Données des passages piétons</h3>
        <table id="csv-table">
            <thead></thead>
            <tbody></tbody>
        </table>
    </div>

    <script>
        // Initialisation de la carte
        const map = L.map('map').setView([44.87, -0.70], 10);
        
        // Couche de tuiles
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
            subdomains: 'abcd',
            maxZoom: 20
        }).addTo(map);

        // --- GESTION DE L'ORDRE DES COUCHES AVEC DES PANES ---
        // On crée des "panes" (volets). Un zIndex plus élevé s'affiche au-dessus.
        map.createPane('stationnementPane');
        map.getPane('stationnementPane').style.zIndex = 401;
        map.createPane('vegetationMairiePane');
        map.getPane('vegetationMairiePane').style.zIndex = 402;
        map.createPane('vegetationPane');
        map.getPane('vegetationPane').style.zIndex = 403;
        map.createPane('amenagementPane');
        map.getPane('amenagementPane').style.zIndex = 404;
        map.createPane('ppPane');
        map.getPane('ppPane').style.zIndex = 405; // Le plus élevé, donc au-dessus de tout

        // Stockage des couches
        const overlayMaps = {};
        let csvData = [];

        // Fonction pour créer le contenu des popups
        function createPopup(feature) {
            let content = `<b>${feature.properties.Notes || 'Information'}</b>`;
            if (feature.properties.Date) {
                content += `<br>Date : ${feature.properties.Date}`;
            }
            if (feature.properties.Photo) {
                content += `<br><img src="${feature.properties.Photo}" alt="Photo" class="popup-photo">`;
            }
            return content;
        }

        // Fonction pour surligner une ligne du CSV
        function highlightCSVRow(fid) {
            const cleanFid = fid.toString().trim();
            document.querySelectorAll('#csv-table tr').forEach(row => {
                row.classList.remove('highlight');
            });
            const rows = document.querySelectorAll('#csv-table tbody tr');
            for (let row of rows) {
                const rowId = row.getAttribute('data-id');
                if (rowId === cleanFid) {
                    row.classList.add('highlight');
                    row.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    return;
                }
            }
            console.warn(`Aucune ligne trouvée pour l'ID: ${fid}`);
        }

        // Fonction pour gérer les événements de survol et clic
        function addHoverEvents(feature, layer) {
            const popupContent = createPopup(feature);
            layer.bindPopup(popupContent);
            
            const tooltipContent = `<b>${feature.properties.Notes || 'Information'}</b><br><i>Cliquez pour voir les détails</i>`;
            layer.bindTooltip(tooltipContent, {
                sticky: true,
                opacity: 0.9
            });
            
            layer.on('click', function(e) {
                if (feature.properties.fid) {
                    highlightCSVRow(feature.properties.fid);
                }
            });
        }

        // Chargement et traitement du CSV
        fetch('stmedard.csv')
            .then(response => response.text())
            .then(data => {
                const lines = data.split('\n').filter(line => line.trim());
                const headers = lines[0].split(';').map(header => header.trim());
                
                const thead = document.querySelector('#csv-table thead');
                const tbody = document.querySelector('#csv-table tbody');
                
                thead.innerHTML = `<tr>${headers.map(h => `<th>${h}</th>`).join('')}</tr>`;
                
                for (let i = 1; i < lines.length; i++) {
                    const cells = lines[i].split(';').map(cell => cell.trim());
                    if (cells.length === headers.length) {
                        const row = document.createElement('tr');
                        row.setAttribute('data-id', cells[4]);
                        row.innerHTML = cells.map(cell => `<td>${cell}</td>`).join('');
                        tbody.appendChild(row);
                        
                        csvData.push({
                            id: cells[4],
                            data: cells
                        });
                    }
                }
            })
            .catch(error => {
                console.error('Erreur lors du chargement du CSV:', error);
                document.querySelector('#csv-container').innerHTML = 
                    '<p>Erreur lors du chargement des données tabulaires.</p>';
            });

        // Chargement des couches GeoJSON
        function loadGeoJSON(url, layerName, options) {
            fetch(url)
                .then(response => response.json())
                .then(data => {
                    // On ajoute onEachFeature aux options passées à la fonction
                    options.onEachFeature = addHoverEvents;
                    
                    const layer = L.geoJSON(data, options).addTo(map);
                    
                    overlayMaps[layerName] = layer;
                    updateLayerControl();
                })
                .catch(error => {
                    console.error(`Erreur lors du chargement de ${url}:`, error);
                });
        }

        // --- APPEL DES COUCHES DANS L'ORDRE SOUHAITÉ ---
        // L'ordre d'appel n'a plus d'importance pour l'affichage grâce aux panes, 
        // mais c'est plus propre de les lister ici.

        // 5. Stationnement (en dessous de tout)
        loadGeoJSON('stationnement.geojson', "Stationnement", { 
            pane: 'stationnementPane',
            style: { color: "#ff0000", weight: 4, opacity: 0.8 }
        });

        // 4. Végétation Mairie (nouvelle couche)
        loadGeoJSON('vegetationmairie.geojson', "Végétation Mairie", { 
            pane: 'vegetationMairiePane',
            style: { color: "#90EE90", weight: 4, opacity: 0.8 } // Vert clair
        });
        
        // 3. Végétation
        loadGeoJSON('vegetation.geojson', "Végétation", { 
            pane: 'vegetationPane',
            style: { color: "#28a745", weight: 4, opacity: 0.8 }
        });

        // 2. Aménagement (nouvelle couche)
        loadGeoJSON('amenagement.geojson', "Aménagement", {
            pane: 'amenagementPane',
            style: { color: "#800080", weight: 4, opacity: 0.8 } // Violet
        });

        // 1. Passages Piétons (au-dessus de tout)
        loadGeoJSON('pp.geojson', "Passages Piétons", { 
            pane: 'ppPane',
            style: { color: "#007bff", weight: 12, opacity: 1, dashArray: '10, 10' }
        });


        // Mise à jour du contrôle des couches
        let layerControl = null;
        function updateLayerControl() {
            if (layerControl) {
                map.removeControl(layerControl);
            }
            
            layerControl = L.control.layers(null, overlayMaps, {
                collapsed: false,
                position: 'topright'
            }).addTo(map);
        }

        // Ajout d'une légende personnalisée (MISE À JOUR)
        const legend = L.control({ position: 'bottomright' });
        legend.onAdd = function(map) {
            const div = L.DomUtil.create('div', 'layer-control');
            div.innerHTML = `
                <h4>Légende</h4>
                <div><span style="display:inline-block; width:20px; height:10px; border-bottom: 3px dashed #007bff; margin-right:5px;"></span> Passages piétons</div>
                <div><span style="display:inline-block; width:20px; height:10px; background:#800080; margin-right:5px;"></span> Aménagement</div>
                <div><span style="display:inline-block; width:20px; height:10px; background:#28a745; margin-right:5px;"></span> Végétation</div>
                <div><span style="display:inline-block; width:20px; height:10px; background:#90EE90; margin-right:5px;"></span> Végétation Mairie</div>
                <div><span style="display:inline-block; width:20px; height:10px; background:#ff0000; margin-right:5px;"></span> Stationnement</div>
            `;
            // J'ai aussi corrigé les couleurs pour qu'elles correspondent à la symbologie.
            return div;
        };
        legend.addTo(map);
    </script>
</body>
</html>
